# =====================================================================
# Alexa Arts Classes - FREE CLOUD APK BUILDER
# Jab aap code GitHub par push karoge, ye workflow automatically
# release APK build kar ke download ke liye upload kar dega.
#
# KYA KARNA HAI:
#   1. GitHub par naya repo banao (e.g. "alexa-arts-classes")
#   2. Ye folder usme push karo
#   3. Actions tab kholo -> build karne ke liye play button dabao
#   4. Artifact download karo -> APK ready hai!
#
# IMPORTANT: Secret add karna:
#   Repo > Settings > Secrets > New repository secret
#   Name: WEB_APP_ID    Value: apne Firebase Web App ID
#   (Firebase Console > Project Settings > Your apps > Web)
# =====================================================================

name: 🔨 Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '21'

jobs:
  build_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Code checkout
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      # 2. Firebase Web App ID inject karo (secret se)
      - name: 🔑 Configure Firebase Web App ID
        run: |
          sed -i "s|1:796639195377:web:REPLACE_WITH_WEB_APP_ID|${{ secrets.WEB_APP_ID }}|g" admin_panel/src/firebase-config.js
        if: env.WEB_APP_ID != ''

      # 3. Java setup (Android build ke liye)
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Flutter setup
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 5. Flutter dependencies
      - name: 📦 Install Flutter Dependencies
        working-directory: flutter_app
        run: |
          flutter pub get

      # 6. Code quality check (non-blocking)
      - name: 🔍 Analyze Code
        working-directory: flutter_app
        run: flutter analyze --no-pub || echo "Analysis warnings present - continuing build"

      # 7. Widget tests (agar test file hai)
      - name: 🧪 Run Tests
        working-directory: flutter_app
        run: flutter test --no-pub || echo "No tests - skipping"

      # 8. Release APK build (5 formats)
      - name: 📱 Build Release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # 9. Upload APKs as artifact
      - name: 📦 Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: alexa-arts-apks
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # Play Store ke liye App Bundle (optional)
  build_aab:
    name: Build App Bundle (Play Store)
    runs-on: ubuntu-latest
    needs: build_apk
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 📦 Install Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: 📦 Build App Bundle
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: 📦 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: alexa-arts-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          retention-days: 30