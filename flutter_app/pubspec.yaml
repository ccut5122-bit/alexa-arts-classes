name: alexa_artclasses
description: Alexa Arts Classes - JAC Class 11 Arts Study App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.2.0
  firebase_analytics: ^11.3.1
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  audioplayers: ^6.1.0
  intl: ^0.19.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0

  # Offline & Storage (AES encryption)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # TTS
  flutter_tts: ^4.0.2

  # Charts & Export
  fl_chart: ^0.69.2

  # Forum
  image_picker: ^1.1.2
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/